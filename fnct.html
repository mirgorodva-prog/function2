<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Функція піднесення до ступеня</title>
    <link rel="stylesheet" href="fnct.css">
</head>
<body>

    <div class="card">
        <h2>Калькулятор ступеня</h2>
        <p>Приклад функції <code>pow(x, n)</code> на JavaScript.</p>
        
        <div class="input-field">
            <label for="baseInput">Число (x):</label>
            <input type="number" id="baseInput" value="2" placeholder="Введіть число">
        </div>

        <div class="input-field">
            <label for="exponentInput">Ступінь (n):</label>
            <input type="number" id="exponentInput" value="3" placeholder="Введіть ступінь">
        </div>

        <button id="calcBtn">Обчислити</button>

        <div class="result-box">
            Результат: <span id="resultValue">8</span>
        </div>
    </div>

    <script src="fnct.js"></script>
</body>
</html>
